      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --stacktrace

      - name: Build release APK (fast version)
        working-directory: proj
        run: gradle assembleRelease --stacktrace

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          cp proj/app/build/outputs/apk/release/*.apk out/R4Vn-release.apk || true
          cp proj/app/build/outputs/apk/debug/*.apk out/R4Vn-debug.apk || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R4Vn-release
          path: out/R4Vn-release.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R4Vn-debug
          path: out/R4Vn-debug.apk
          if-no-files-found: ignore

      - name: Publish APKs to Releases
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(ls out/*.apk 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "no apk to publish"; exit 0; fi
          gh release create "build-${{ github.run_number }}" $FILES \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "R4Vn Music build ${{ github.run_number }}" \
            --notes "APK files of build ${{ github.run_number }}"
